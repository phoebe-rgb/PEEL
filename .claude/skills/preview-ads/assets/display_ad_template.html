<!DOCTYPE html>
<!--
  Google Display Network banner preview template.
  Fill in {{PLACEHOLDERS}}. Each .banner is an EXACT-pixel box — do not resize it.
  Layouts differ by shape: box (300x250 / 336x280), leaderboard (728x90), skyscraper (160x600).
  Replace {{IMAGE_SRC}} with a data: URI or file path; if no image, leave the placeholder block.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{BRAND_NAME}} — Display Ad Preview</title>
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; padding: 40px; background: #f1f3f4;
    font-family: arial, sans-serif; color: #202124;
  }
  .page-title { font-size: 15px; color: #5f6368; margin: 0 0 24px; }
  .banners { display: flex; flex-wrap: wrap; gap: 48px; align-items: flex-start; }
  .banner-wrap { }
  .banner-label {
    font-size: 12px; font-weight: bold; color: #5f6368; margin-bottom: 8px;
    text-transform: uppercase; letter-spacing: .04em;
  }
  .banner {
    box-sizing: border-box; background: #fff; border: 1px solid #dadce0;
    overflow: hidden; position: relative;
  }
  .img, .img-placeholder { background: #e0e3e7; background-size: cover; background-position: center; }
  .img-placeholder {
    display: flex; align-items: center; justify-content: center;
    color: #9aa0a6; font-size: 12px;
  }
  .brand { font-weight: 700; color: #202124; }
  .headline { color: #3c4043; }
  .cta {
    display: inline-block; background: #1a73e8; color: #fff; border-radius: 4px;
    font-weight: 700; text-align: center; white-space: nowrap;
  }

  /* ---- 300x250 medium rectangle (box) ---- */
  .b-300x250 { width: 300px; height: 250px; display: flex; flex-direction: column; }
  .b-300x250 .img, .b-300x250 .img-placeholder { flex: 1 1 auto; }
  .b-300x250 .body { padding: 12px 14px; }
  .b-300x250 .brand { font-size: 13px; }
  .b-300x250 .headline { font-size: 16px; margin: 2px 0 10px; line-height: 1.25; }
  .b-300x250 .cta { font-size: 13px; padding: 8px 16px; }

  /* ---- 728x90 leaderboard (horizontal) ---- */
  .b-728x90 { width: 728px; height: 90px; display: flex; align-items: center; }
  .b-728x90 .img, .b-728x90 .img-placeholder { width: 120px; height: 90px; flex: 0 0 auto; }
  .b-728x90 .body { flex: 1 1 auto; padding: 0 20px; }
  .b-728x90 .brand { font-size: 14px; }
  .b-728x90 .headline { font-size: 18px; line-height: 1.2; }
  .b-728x90 .cta { font-size: 14px; padding: 10px 22px; margin: 0 20px 0 0; flex: 0 0 auto; }

  /* ---- 160x600 wide skyscraper (vertical) ---- */
  .b-160x600 { width: 160px; height: 600px; display: flex; flex-direction: column; }
  .b-160x600 .img, .b-160x600 .img-placeholder { height: 300px; flex: 0 0 auto; }
  .b-160x600 .body { padding: 16px 14px; display: flex; flex-direction: column; gap: 12px; flex: 1 1 auto; }
  .b-160x600 .brand { font-size: 14px; }
  .b-160x600 .headline { font-size: 18px; line-height: 1.3; }
  .b-160x600 .cta { font-size: 14px; padding: 11px 14px; margin-top: auto; }
</style>
</head>
<body>
  <p class="page-title">Display ad preview — {{BRAND_NAME}}</p>
  <div class="banners">

    <!-- 300x250 -->
    <div class="banner-wrap">
      <div class="banner-label">Medium rectangle · 300×250</div>
      <div class="banner b-300x250">
        <div class="img-placeholder" style="background-image:url('{{IMAGE_SRC}}')">Your image</div>
        <div class="body">
          <div class="brand">{{BRAND_NAME}}</div>
          <div class="headline">{{HEADLINE}}</div>
          <span class="cta">{{CTA}}</span>
        </div>
      </div>
    </div>

    <!-- 728x90 -->
    <div class="banner-wrap">
      <div class="banner-label">Leaderboard · 728×90</div>
      <div class="banner b-728x90">
        <div class="img-placeholder" style="background-image:url('{{IMAGE_SRC}}')">Image</div>
        <div class="body">
          <div class="brand">{{BRAND_NAME}}</div>
          <div class="headline">{{HEADLINE}}</div>
        </div>
        <span class="cta">{{CTA}}</span>
      </div>
    </div>

    <!-- 160x600 -->
    <div class="banner-wrap">
      <div class="banner-label">Wide skyscraper · 160×600</div>
      <div class="banner b-160x600">
        <div class="img-placeholder" style="background-image:url('{{IMAGE_SRC}}')">Your image</div>
        <div class="body">
          <div class="brand">{{BRAND_NAME}}</div>
          <div class="headline">{{HEADLINE}}</div>
          <span class="cta">{{CTA}}</span>
        </div>
      </div>
    </div>

  </div>
</body>
</html>
