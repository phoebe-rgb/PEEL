# Netlify config for the SEG Lead Tracking dashboard
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "public"
  functions = "netlify/functions"

# Lost-lead alert — runs ONCE a day, right after the morning Salesforce export
# (export 08:15, alert 08:45 Asia/Bangkok = Vietnam time = 01:45 UTC), so it reads the fresh
# CRM sheet. If any NEW lead became lost since yesterday's run it sends one Slack message;
# if nothing is new it stays silent. Each lost lead is alerted once (remembered in Netlify
# Blobs). Netlify cron is UTC.
[functions."lost-lead-alert"]
  schedule = "45 1 * * *"

# Protect the dashboard: it shows real lead PII, so it must NOT be public.
# Set a site password in Netlify UI (Site settings → Access & security → Visitor access → Password protection)
# OR restrict to your Netlify team via SSO. This file cannot set the password; do it in the UI.
