# Netlify config for the SEG Lead Tracking dashboard
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "public"
  functions = "netlify/functions"

# Lost-lead alert — runs 30 min after each Salesforce export (exports 08:15 & 14:15
# Asia/Bangkok; alert 08:45 & 14:45 Bangkok = 01:45 & 07:45 UTC), so a newly lost lead is
# flagged once the refreshed CRM sheet is in. It alerts each new lost lead once (remembered
# in Netlify Blobs). Netlify cron is UTC.
[functions."lost-lead-alert"]
  schedule = "45 1,7 * * *"

# Protect the dashboard: it shows real lead PII, so it must NOT be public.
# Set a site password in Netlify UI (Site settings → Access & security → Visitor access → Password protection)
# OR restrict to your Netlify team via SSO. This file cannot set the password; do it in the UI.
