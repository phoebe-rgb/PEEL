<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SEG Lead Tracking</title>
<style>
  :root{--bg:#0f1420;--pan:#171e2e;--line:#2b3650;--tx:#e8edf7;--mut:#9aa7c2;--acc:#5b8cff;--good:#37c98b;--bad:#ff5c7a}
  @media(prefers-color-scheme:light){:root{--bg:#f4f6fb;--pan:#fff;--line:#e0e6f1;--tx:#16203a;--mut:#5c6b8a}}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 16px 60px}h1{font-size:20px;margin:0 0 2px}
  .sub{color:var(--mut);font-size:13px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
  .n{font-size:26px;font-weight:700}.l{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:14px}
  th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--mut)} .tbox{max-height:460px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-top:14px}
  .note{color:var(--mut);font-size:13px;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>SEG Lead Tracking — Netlify vs CRM</h1>
  <div class="sub" id="sub">Đang tải…</div>
  <div class="grid" id="kpis"></div>
  <div id="tbl"></div>
  <p class="note">Cảnh báo tự động chạy hằng ngày qua Slack (function <code>lost-lead-alert</code>). Trang này chỉ để xem nhanh.</p>
</div>
<script>
const esc=s=>(s==null?'':(''+s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
fetch('/.netlify/functions/leads').then(r=>r.json()).then(d=>{
  const real=d.leads.filter(l=>!l.is_test);
  document.getElementById('sub').textContent=real.length+' lead thật · cập nhật '+new Date(d.generated_at).toLocaleString('vi-VN')+(d.crm_connected?'':' · ⚠️ chưa nối nguồn CRM');
  const s=d.summary, k=[];
  k.push(kpi(real.length,'Lead Netlify'));
  if(s){k.push(kpi(s.matched,'Vào CRM','var(--good)'));k.push(kpi(s.lost,'Lead MẤT','var(--bad)'));k.push(kpi(s.pending,'Chờ (<2 ngày)'));}
  else{k.push(kpi('—','Vào CRM'));k.push(kpi('—','Lead MẤT'));k.push(kpi('—','Chờ'));}
  document.getElementById('kpis').innerHTML=k.join('');
  const rows=d.crm_connected?real.filter(l=>l.in_crm===false):real.slice(0,80);
  document.getElementById('tbl').innerHTML='<div class="tbox"><table><thead><tr><th>Ngày</th><th>Trường</th><th>Tên</th><th>Email</th><th>Điện thoại</th><th>Nguồn</th></tr></thead><tbody>'+
    rows.map(l=>`<tr><td>${(l.created_at||'').slice(0,10)}</td><td>${l.brand}</td><td>${esc((l.first_name+' '+l.last_name).trim())}</td><td>${esc(l.email)}</td><td>${esc(l.phone)}</td><td>${esc(l.source)}</td></tr>`).join('')+'</tbody></table></div>';
}).catch(e=>document.getElementById('sub').textContent='Lỗi tải dữ liệu: '+e.message);
function kpi(n,l,c){return `<div class="card"><div class="n" style="${c?'color:'+c:''}">${n}</div><div class="l">${l}</div></div>`;}
</script>
</body>
</html>
