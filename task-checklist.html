<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Task tracker · 6–9 Nov 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f4; --surface:#fff; --line:#e4e3de; --line2:#efeeea;
    --ink:#1b1b19; --ink2:#5f5e58; --ink3:#8e8d85;
    --accent:#a8561f; --accent-soft:#f6ece3;
    --ok:#2f7a4f; --ok-soft:#eaf4ee;
    --hi:#b3261e; --hi-soft:#fbeceb;
    --mid:#8a6d1f; --mid-soft:#f8f2e0;
    --radius:14px;
    --shadow:0 1px 2px rgba(24,24,20,.05), 0 8px 24px -16px rgba(24,24,20,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14140f; --surface:#1d1d18; --line:#32322b; --line2:#272722;
      --ink:#f2f1ec; --ink2:#b0afa7; --ink3:#81807a;
      --accent:#e39b64; --accent-soft:#2e2318;
      --ok:#7cc79b; --ok-soft:#1b2a21;
      --hi:#f08b84; --hi-soft:#2e1d1b;
      --mid:#ddc075; --mid-soft:#2a2516;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:860px;margin:0 auto;padding:32px 20px 96px}

  header h1{font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;font-weight:700}
  header .sub{color:var(--ink2);font-size:13.5px;margin:0}

  /* progress */
  .board{
    margin:22px 0 18px;padding:18px 20px;background:var(--surface);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  }
  .board-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
  .count{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .count small{font-size:13px;font-weight:500;color:var(--ink3)}
  .bar{height:8px;border-radius:99px;background:var(--line2);overflow:hidden;margin-top:12px}
  .bar span{display:block;height:100%;width:0;background:var(--ok);border-radius:99px;transition:width .35s cubic-bezier(.4,0,.2,1)}
  .board-note{font-size:12.5px;color:var(--ink3);margin-top:10px}

  /* filters */
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .chip{
    font:inherit;font-size:13px;font-weight:500;cursor:pointer;
    padding:6px 13px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink2);transition:.15s;
  }
  .chip:hover{border-color:var(--ink3);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}

  /* groups */
  .group{margin:0 0 26px}
  .group-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 2px}
  .group-head h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--ink3);font-weight:600}
  .group-head .gcount{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .group-head .rule{flex:1;height:1px;background:var(--line)}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

  .task{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;box-shadow:var(--shadow);transition:.2s;
  }
  .task.done{opacity:.52}
  .task.done .t-title{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--ink3)}

  /* the tick button */
  .tick{
    flex:0 0 auto;margin-top:1px;width:24px;height:24px;padding:0;cursor:pointer;
    border-radius:7px;border:1.5px solid var(--line);background:transparent;
    display:grid;place-items:center;transition:.15s;
  }
  .tick:hover{border-color:var(--ok);background:var(--ok-soft)}
  .tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tick svg{width:14px;height:14px;stroke:var(--ok);stroke-width:2.6;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transform:scale(.6);transition:.18s cubic-bezier(.4,0,.2,1)}
  .tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
  .tick[aria-pressed="true"] svg{opacity:1;transform:scale(1);stroke:var(--surface)}

  .t-body{flex:1;min-width:0}
  .t-title{font-size:14.5px;font-weight:600;line-height:1.4;margin:0;letter-spacing:-.005em}
  .t-detail{font-size:13px;color:var(--ink2);margin:5px 0 0}
  .t-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:11.5px}
  .tag{padding:2.5px 8px;border-radius:99px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .tag.p-hi{background:var(--hi-soft);color:var(--hi)}
  .tag.p-mid{background:var(--mid-soft);color:var(--mid)}
  .tag.p-low{background:var(--line2);color:var(--ink3)}
  .tag.who{background:var(--accent-soft);color:var(--accent)}
  .t-meta .src{color:var(--ink3)}
  .t-meta a{color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
  .t-meta a:hover{color:var(--accent)}

  .empty{color:var(--ink3);font-size:13.5px;padding:8px 2px}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ghost{font:inherit;font-size:12.5px;cursor:pointer;background:none;border:none;
    color:var(--ink3);text-decoration:underline;text-underline-offset:2px;padding:0}
  .ghost:hover{color:var(--hi)}

  @media (max-width:560px){
    .wrap{padding:22px 14px 80px}
    header h1{font-size:21px}
  }
</style>
</head>

const P_LABEL = {hi:"Gấp", mid:"Trung bình", low:"Khi có thời gian"};
const KEY = "peel-tasks-06-09nov-v1";

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

const id = i => "t" + i;
const GROUPS = [...new Set(TASKS.map(t => t.g))];
let filter = "todo";

const listEl = document.getElementById("list");
const filtersEl = document.getElementById("filters");

function visible(t, i){
  if (filter === "all") return true;
  if (filter === "todo") return !state[id(i)];
  if (filter === "done") return !!state[id(i)];
  if (filter === "hi")   return t.p === "hi" && !state[id(i)];
  return t.g === filter;
}

function renderFilters(){
  const todo = TASKS.filter((t,i)=>!state[id(i)]).length;
  const done = TASKS.length - todo;
  const hi   = TASKS.filter((t,i)=>t.p==="hi" && !state[id(i)]).length;
  const defs = [
    ["todo","Chưa xong",todo],
    ["hi","Gấp",hi],
    ["all","Tất cả",TASKS.length],
    ["done","Đã xong",done],
    ...GROUPS.map(g => [g, g, TASKS.filter((t,i)=>t.g===g && !state[id(i)]).length])
  ];
  filtersEl.innerHTML = "";
  defs.forEach(([k,label,n])=>{
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter===k));
    b.innerHTML = label + '<span class="n">' + n + '</span>';
    b.addEventListener("click", ()=>{ filter = k; render(); });
    filtersEl.appendChild(b);
  });
}

function taskNode(t, i){
  const key = id(i), done = !!state[key];
  const li = document.createElement("li");
  li.className = "task" + (done ? " done" : "");

  const btn = document.createElement("button");
  btn.className = "tick";
  btn.type = "button";
  btn.setAttribute("aria-pressed", String(done));
  btn.setAttribute("aria-label", (done ? "Bỏ tick: " : "Tick xong: ") + t.t);
  btn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>';
  btn.addEventListener("click", ()=>{
    state[key] = !state[key];
    if (!state[key]) delete state[key];
    save(); render();
  });

  const body = document.createElement("div");
  body.className = "t-body";

  const h = document.createElement("p");
  h.className = "t-title";
  h.textContent = t.t;
  body.appendChild(h);

  if (t.d){
    const d = document.createElement("p");
    d.className = "t-detail";
    d.textContent = t.d;
    body.appendChild(d);
  }

  const meta = document.createElement("div");
  meta.className = "t-meta";
  meta.innerHTML =
    '<span class="tag p-'+t.p+'">'+P_LABEL[t.p]+'</span>' +
    '<span class="tag who">'+t.who+'</span>' +
    '<span class="src">'+t.s+'</span>';
  if (t.u){
    const a = document.createElement("a");
    a.href = t.u; a.target = "_blank"; a.rel = "noopener";
    a.textContent = t.ul || "mở";
    meta.appendChild(a);
  }
  body.appendChild(meta);

  li.appendChild(btn);
  li.appendChild(body);
  return li;
}

function render(){
  renderFilters();
  listEl.innerHTML = "";
  let shown = 0;

  GROUPS.forEach(g => {
    const items = TASKS.map((t,i)=>[t,i]).filter(([t,i]) => t.g===g && visible(t,i));
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement("section");
    sec.className = "group";
    const total = TASKS.filter(t=>t.g===g).length;
    const gdone = TASKS.filter((t,i)=>t.g===g && state[id(i)]).length;
    sec.innerHTML = '<div class="group-head"><h2>'+g+'</h2>' +
      '<span class="gcount">'+gdone+'/'+total+'</span><span class="rule"></span></div>';
    const ul = document.createElement("ul");
    items.forEach(([t,i]) => ul.appendChild(taskNode(t,i)));
    sec.appendChild(ul);
    listEl.appendChild(sec);
  });

  if (!shown){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = filter === "todo" ? "Hết task rồi 🎉" : "Không có task nào ở mục này.";
    listEl.appendChild(p);
  }

  const done = TASKS.filter((t,i)=>state[id(i)]).length;
  document.getElementById("doneN").textContent = done;
  document.getElementById("allN").textContent = TASKS.length;
  document.getElementById("barFill").style.width = (done/TASKS.length*100) + "%";
  const left = TASKS.length - done;
  const hiLeft = TASKS.filter((t,i)=>t.p==="hi" && !state[id(i)]).length;
  document.getElementById("leftLbl").textContent =
    left ? ("còn " + left + " task" + (hiLeft ? " · " + hiLeft + " gấp" : "")) : "xong hết";
}

document.getElementById("reset").addEventListener("click", ()=>{
  state = {}; save(); render();
});

document.getElementById("stamp").textContent =
  "Nguồn: Slack (#peel-myamia, #seg-campaign-requests, #seg-review-copy-and-assets, #seg-paid-media, #client-pension-refund, #client-myth-studio, DM) + Gmail · 06–09/11/2026";

render();
</script>
</body>
</html>
