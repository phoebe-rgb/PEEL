<style>

    --tagd:#1d5b8f; --tagd-soft:#e8f0f8;

    --shadow:0 1px 2px rgba(24,24,20,.05), 0 8px 24px -16px rgba(24,24,20,.18);
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#14140f; --surface:#1d1d18; --line:#32322b; --line2:#272722;
      --ink:#f2f1ec; --ink2:#b0afa7; --ink3:#81807a;
      --accent:#e39b64; --accent-soft:#2e2318;
      --ok:#7cc79b; --ok-soft:#1b2a21;
      --hi:#f08b84; --hi-soft:#2e1d1b;
      --mid:#ddc075; --mid-soft:#2a2516;
      --tagd:#8dbbe4; --tagd-soft:#17222d;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -16px rgba(0,0,0,.6);
    }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{

  .wrap{max-width:880px;margin:0 auto;padding:32px 20px 96px}

  header h1{font-size:25px;line-height:1.2;margin:0 0 6px;letter-spacing:-.02em;font-weight:700}
  header .sub{color:var(--ink2);font-size:13.5px;margin:0}

  .board{

  .count{font-size:22px;font-weight:700;letter-spacing:-.02em}
  .count small{font-size:13px;font-weight:500;color:var(--ink3)}

  .board-note{font-size:12.5px;color:var(--ink3);margin-top:10px}

  .lead{margin:0 0 18px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}

  .filters{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
  .chip{
    font:inherit;font-size:13px;font-weight:500;cursor:pointer;
    padding:6px 13px;border-radius:99px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink2);transition:.15s;
  }
  .chip:hover{border-color:var(--ink3);color:var(--ink)}
  .chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
  .chip .n{opacity:.55;margin-left:5px;font-variant-numeric:tabular-nums}

  .group{margin:0 0 26px}
  .group-head{display:flex;align-items:center;gap:10px;margin:0 0 10px;padding:0 2px}
  .group-head h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;margin:0;color:var(--ink3);font-weight:600}
  .group-head .gcount{font-size:12px;color:var(--ink3);font-variant-numeric:tabular-nums}
  .group-head .rule{flex:1;height:1px;background:var(--line)}

  ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}

  .task{
    display:flex;gap:13px;align-items:flex-start;
    background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;box-shadow:var(--shadow);transition:.2s;
  }
  .task.direct{border-left:3px solid var(--tagd)}
  .task.done{opacity:.52}
  .task.done .t-title{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--ink3)}

  .tick{
    flex:0 0 auto;margin-top:1px;width:24px;height:24px;padding:0;cursor:pointer;
    border-radius:7px;border:1.5px solid var(--line);background:transparent;
    display:grid;place-items:center;transition:.15s;
  }
  .tick:hover{border-color:var(--ok);background:var(--ok-soft)}
  .tick:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .tick svg{width:14px;height:14px;stroke:var(--ok);stroke-width:2.6;fill:none;
    stroke-linecap:round;stroke-linejoin:round;
    opacity:0;transform:scale(.6);transition:.18s cubic-bezier(.4,0,.2,1)}
  .tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
  .tick[aria-pressed="true"] svg{opacity:1;transform:scale(1);stroke:var(--surface)}

  .t-body{flex:1;min-width:0}
  .t-title{font-size:14.5px;font-weight:600;line-height:1.4;margin:0;letter-spacing:-.005em}
  .t-ask{font-size:13px;color:var(--ink);margin:6px 0 0;padding-left:10px;

  .t-detail{font-size:13px;color:var(--ink2);margin:6px 0 0}
  .t-meta{display:flex;gap:7px;flex-wrap:wrap;align-items:center;margin-top:9px;font-size:11.5px}
  .tag{padding:2.5px 8px;border-radius:99px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
  .tag.p-hi{background:var(--hi-soft);color:var(--hi)}
  .tag.p-mid{background:var(--mid-soft);color:var(--mid)}
  .tag.p-low{background:var(--line2);color:var(--ink3)}
  .tag.m-tag{background:var(--tagd-soft);color:var(--tagd)}
  .tag.m-team,.tag.m-fyi,.tag.m-self,.tag.m-bot{background:var(--line2);color:var(--ink3)}
  .tag.fin{background:var(--ok-soft);color:var(--ok)}
  .t-meta .src{color:var(--ink3)}
  .t-meta a{color:var(--ink3);text-decoration:underline;text-underline-offset:2px}
  .t-meta a:hover{color:var(--accent)}

  .t-actions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
  .fb-btn{
    font:inherit;font-size:12px;font-weight:600;cursor:pointer;
    padding:5px 11px;border-radius:99px;border:1px solid var(--line);
    background:transparent;color:var(--ink2);transition:.15s;
    display:inline-flex;align-items:center;gap:5px;
  }
  .fb-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .fb-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .fb-btn.has{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  .fb-btn svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;
    stroke-linecap:round;stroke-linejoin:round}

  .note{margin-top:10px;border:1px solid var(--line);border-radius:10px;
    background:var(--bg);padding:10px}
  .note[hidden]{display:none}
  .note textarea{
    width:100%;min-height:72px;resize:vertical;font:inherit;font-size:13px;
    color:var(--ink);background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;line-height:1.5;
  }
  .note textarea:focus{outline:none;border-color:var(--accent)}
  .note-row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
  .note-hint{font-size:11.5px;color:var(--ink3);flex:1;min-width:150px}

  .empty{color:var(--ink3);font-size:13.5px;padding:8px 2px}

  footer{margin-top:34px;padding-top:18px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--ink3);display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .ghost{font:inherit;font-size:12.5px;cursor:pointer;background:none;border:none;
    color:var(--ink3);text-decoration:underline;text-underline-offset:2px;padding:0}
  .ghost:hover{color:var(--hi)}

  @media (max-width:560px){
    .wrap{padding:22px 14px 80px}
    header h1{font-size:21px}
  }
</style>
</head>

 t:"Họp MYAMIA – Ads / Social Meet Up: T4 11/11, 23:00–23:45 (GMT+7)",
 d:"Google Meet, Maria tạo invite. Người tham dự: Maria, Lucie, Piers, Elena, Phoebe + team Tonic Comms (Lauren, Rafaella, Liv). Giờ gốc: 11:00–11:45 ET.",
 s:"Gmail calendar invite · 06/11 20:01"},

const P_LABEL = {hi:"Gấp", mid:"Trung bình", low:"Khi có thời gian"};
const M_LABEL = {
  tag:"Tag trực tiếp @Phoebe",
  team:"Nói chung cả team",
  fyi:"Người khác làm · để nắm",
  self:"Phoebe tự raise",
  bot:"Bot / mail tự động"
};
const KEY  = "peel-tasks-06-09nov-v1";
const NKEY = "peel-tasks-06-09nov-notes-v1";

let state = {};
try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ state = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} };

let notes = {};
try { notes = JSON.parse(localStorage.getItem(NKEY) || "{}"); } catch(e){ notes = {}; }
const saveNotes = () => { try { localStorage.setItem(NKEY, JSON.stringify(notes)); } catch(e){} };

/* ---- kênh feedback: dùng composer comment của Claude khi có ---- */
let commentsApi = null;
const fbMode = document.getElementById("fbMode");

if (window.claude && typeof window.claude.use === "function"){
  window.claude.use("comments").then(api => {
    commentsApi = api || null;
    fbMode.textContent = commentsApi
      ? "Bấm Feedback ở task nào để mở ô comment ngay tại task đó, rồi gửi cho Claude."
      : "Ô comment không mở được ở đây — bấm Feedback để ghi vào trang, rồi Copy và paste vào chat.";
    render();
  }).catch(() => { commentsApi = null; });
}

function tryComposer(el){
  if (!commentsApi) return false;
  try { commentsApi.openComposer({element: el}); return true; }
  catch(e){ return false; }
}

const id = i => "t" + i;
const GROUPS = [...new Set(TASKS.map(t => t.g))];
let filter = "todo";

/* done: true = đã tick, "off" = bỏ tick tay; chưa có gì thì theo cờ fin trong data */
function done(i){
  const v = state[id(i)];
  if (v === true) return true;
  if (v === "off") return false;
  return !!TASKS[i].fin;
}

const listEl = document.getElementById("list");
const filtersEl = document.getElementById("filters");

function visible(t, i){
  if (filter === "all")  return true;
  if (filter === "todo") return !done(i);
  if (filter === "done") return done(i);
  if (filter === "hi")   return t.p === "hi" && !done(i);
  if (filter === "tag")  return t.m === "tag" && !done(i);
  return t.g === filter;
}

function renderFilters(){
  const todo = TASKS.filter((t,i)=>!done(i)).length;
  const doneN = TASKS.length - todo;
  const hi   = TASKS.filter((t,i)=>t.p==="hi" && !done(i)).length;
  const tg   = TASKS.filter((t,i)=>t.m==="tag" && !done(i)).length;
  const defs = [
    ["todo","Chưa xong",todo],
    ["hi","Gấp",hi],
    ["tag","Tag trực tiếp",tg],
    ["all","Tất cả",TASKS.length],
    ["done","Đã xong",doneN],
    ...GROUPS.map(g => [g, g, TASKS.filter((t,i)=>t.g===g && !done(i)).length])
  ];
  filtersEl.innerHTML = "";
  defs.forEach(([k,label,n])=>{
    const b = document.createElement("button");
    b.className = "chip";
    b.type = "button";
    b.setAttribute("aria-pressed", String(filter===k));
    b.innerHTML = label + '<span class="n">' + n + '</span>';
    b.addEventListener("click", ()=>{ filter = k; render(); });
    filtersEl.appendChild(b);
  });
}

function taskNode(t, i){
  const key = id(i), isDone = done(i);
  const li = document.createElement("li");
  li.className = "task" + (isDone ? " done" : "") + (t.m === "tag" ? " direct" : "");

  const btn = document.createElement("button");
  btn.className = "tick";
  btn.type = "button";
  btn.setAttribute("aria-pressed", String(isDone));
  btn.setAttribute("aria-label", (isDone ? "Bỏ tick: " : "Tick xong: ") + t.t);
  btn.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>';
  btn.addEventListener("click", ()=>{
    state[key] = isDone ? "off" : true;
    save(); render();
  });

  const body = document.createElement("div");
  body.className = "t-body";

  const h = document.createElement("p");
  h.className = "t-title";
  h.textContent = t.t;
  body.appendChild(h);

  if (t.ask){
    const q = document.createElement("p");
    q.className = "t-ask";
    q.textContent = t.ask;
    body.appendChild(q);
  }

  if (t.d){
    const d = document.createElement("p");
    d.className = "t-detail";
    d.textContent = t.d;
    body.appendChild(d);
  }

  const meta = document.createElement("div");
  meta.className = "t-meta";
  meta.innerHTML =
    (t.fin ? '<span class="tag fin">'+t.fin+'</span>' : '') +
    '<span class="tag p-'+t.p+'">'+P_LABEL[t.p]+'</span>' +
    '<span class="tag m-'+t.m+'">'+M_LABEL[t.m]+'</span>' +
    '<span class="src">'+t.who+' · '+t.s+'</span>';
  if (t.u){
    const a = document.createElement("a");
    a.href = t.u; a.target = "_blank"; a.rel = "noopener";
    a.textContent = t.ul || "mở";
    meta.appendChild(a);
  }
  body.appendChild(meta);

  /* --- feedback --- */
  const actions = document.createElement("div");
  actions.className = "t-actions";
  const fb = document.createElement("button");
  fb.type = "button";
  fb.className = "fb-btn" + (notes[key] ? " has" : "");
  fb.innerHTML = '<svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.6 9.6 0 0 1-2.8-.4L3 21l1.6-4.4A8.3 8.3 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>' +
    (notes[key] ? "Feedback đã ghi" : "Feedback / yêu cầu");
  actions.appendChild(fb);
  body.appendChild(actions);

  const note = document.createElement("div");
  note.className = "note";
  note.hidden = true;
  const ta = document.createElement("textarea");
  ta.placeholder = "Viết yêu cầu của bạn cho task này — ví dụ: “làm hộ slide này”, “đổi angle”, “bỏ task này đi”…";
  ta.value = notes[key] || "";
  const row = document.createElement("div");
  row.className = "note-row";
  const hint = document.createElement("span");
  hint.className = "note-hint";
  hint.textContent = "Lưu trong trình duyệt này. Copy rồi paste vào chat để Claude làm.";
  const copyBtn = document.createElement("button");
  copyBtn.type = "button"; copyBtn.className = "fb-btn";
  copyBtn.textContent = "Copy cho Claude";
  copyBtn.addEventListener("click", ()=>{
    const text = "Task: " + t.t + " (" + t.g + ")\nYêu cầu: " + ta.value.trim();
    navigator.clipboard.writeText(text).then(
      ()=>{ copyBtn.textContent = "Đã copy ✓"; setTimeout(()=>copyBtn.textContent="Copy cho Claude",1600); },
      ()=>{ copyBtn.textContent = "Copy không được"; setTimeout(()=>copyBtn.textContent="Copy cho Claude",1600); }
    );
  });
  ta.addEventListener("input", ()=>{
    const v = ta.value.trim();
    if (v) notes[key] = ta.value; else delete notes[key];
    saveNotes();
    fb.classList.toggle("has", !!v);
  });
  row.appendChild(hint); row.appendChild(copyBtn);
  note.appendChild(ta); note.appendChild(row);
  body.appendChild(note);

  fb.addEventListener("click", ()=>{
    if (tryComposer(li)) return;
    note.hidden = !note.hidden;
    if (!note.hidden) ta.focus();
  });

  li.appendChild(btn);
  li.appendChild(body);
  return li;
}

function render(){
  renderFilters();
  listEl.innerHTML = "";
  let shown = 0;

  GROUPS.forEach(g => {
    const items = TASKS.map((t,i)=>[t,i]).filter(([t,i]) => t.g===g && visible(t,i));
    if (!items.length) return;
    shown += items.length;

    const sec = document.createElement("section");
    sec.className = "group";
    const total = TASKS.filter(t=>t.g===g).length;
    const gdone = TASKS.filter((t,i)=>t.g===g && done(i)).length;
    sec.innerHTML = '<div class="group-head"><h2>'+g+'</h2>' +
      '<span class="gcount">'+gdone+'/'+total+'</span><span class="rule"></span></div>';
    const ul = document.createElement("ul");
    items.forEach(([t,i]) => ul.appendChild(taskNode(t,i)));
    sec.appendChild(ul);
    listEl.appendChild(sec);
  });

  if (!shown){
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = filter === "todo" ? "Hết task rồi 🎉" : "Không có task nào ở mục này.";
    listEl.appendChild(p);
  }

  const doneN = TASKS.filter((t,i)=>done(i)).length;
  document.getElementById("doneN").textContent = doneN;
  document.getElementById("allN").textContent = TASKS.length;
  document.getElementById("barFill").style.width = (doneN/TASKS.length*100) + "%";
  const left = TASKS.length - doneN;
  const hiLeft = TASKS.filter((t,i)=>t.p==="hi" && !done(i)).length;
  document.getElementById("leftLbl").textContent =
    left ? ("còn " + left + " task" + (hiLeft ? " · " + hiLeft + " gấp" : "")) : "xong hết";
}

document.getElementById("globalFb").addEventListener("click", (e)=>{
  if (tryComposer(e.currentTarget)) return;
  fbMode.textContent = "Ô comment chưa sẵn — gõ request trực tiếp vào chat với Claude nhé.";
});

document.getElementById("reset").addEventListener("click", ()=>{
  state = {}; save(); render();
});

document.getElementById("stamp").textContent =
  "Nguồn: Slack (#peel-myamia, #seg-campaign-requests, #seg-review-copy-and-assets, #seg-paid-media, #client-pension-refund, #client-myth-studio, group DM, DM Lucie/Elena) + Gmail · 06–09/11/2026";

render();
</script>
