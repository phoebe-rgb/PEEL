# Netlify deploy config for the CAAS Bachelor landing page.
# The page is a self-contained static site in ./caas-bachelor.
[build]
  publish = "caas-bachelor"
  command = ""

# Nice URL: serve /caas-bachelor/index.html at the site root.
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200
